---
# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        DOMAIN_NAME:
          description: 'URL domain'
          required: true
          type: choice
          options:
            - webservices-test
            - webservices
        STORE_NAME:
          description: 'Transact store name'
          required: true
          type: choice
          options:
            - UCLALIBRARYTEST
            - UCLALIBRARY
        STORE_TYPE:
          description: 'Transact store type'
          required: true
          type: choice
          options:
            - train
            - commerce

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 8
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version: '8'
        distribution: 'corretto'
        cache: maven
    - name: Build with Maven
      env:
        GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
        REPO_SERVER: ${{ secrets.REPO_SERVER }}
        REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
        DEPLOY_DOMAIN: ${{ inputs.DOMAIN_NAME }}
        DEPLOY_STORENAME: ${{ inputs.STORE_NAME }}
        DEPLOY_STORETYPE: ${{ inputs.STORE_TYPE }}
      run: |
        mvn -ntp package -Dwebservices.base="$DEPLOY_DOMAIN" -Dtransact.type="$DEPLOY_STORETYPE" -Dtransact.store="$DEPLOY_STORENAME" 
    - name: Deploy with Jenkins
      env:
        CI_WS_SSH_PRIV_KEY: ${{ secrets.CI_WS_SSH_PRIV_KEY }}
        CI_JENKINS_DEPLOY_TOKEN: ${{ secrets.CI_JENKINS_DEPLOY_TOKEN }}
        CI_JENKINS_JOB_URI: ${{ secrets.CI_JENKINS_JOB_URI }}
        CI_JENKINS_TOMCAT_HOST: ${{ secrets.CI_JENKINS_TOMCAT_HOST }}
        CI_JENKINS_USER_CREDS: ${{ secrets.CI_JENKINS_USER_CREDS }}
        CI_WEBAPP_NAME: ${{ secrets.CI_WEBAPP_NAME }}
      # run: sh scripts/deploy.sh
